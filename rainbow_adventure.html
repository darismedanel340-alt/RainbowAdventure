<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbow Adventure</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #bdeeff; font-family: Arial, sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  #wrap { width: min(900px, 100vw); padding: 10px; }
  h1 { text-align:center; margin: 4px 0 8px; color:#5b3aa4; }
  #game {
    position: relative; overflow: hidden; border: 5px solid white; border-radius: 24px;
    background: linear-gradient(#8ed8ff 0 62%, #8ee36f 62%);
    box-shadow: 0 8px 25px #6aa;
    aspect-ratio: 16/9;
  }
  #hud {
    position:absolute; top:10px; left:15px; right:15px; z-index:5;
    display:flex; justify-content:space-between; font-weight:bold; font-size:20px;
    color:#4a287c; text-shadow:0 1px white;
  }
  #player {
    position:absolute; width:54px; height:54px; left:80px; bottom:19%;
    font-size:48px; line-height:54px; z-index:3; user-select:none;
  }
  .star { position:absolute; font-size:32px; z-index:2; }
  .obstacle { position:absolute; font-size:42px; z-index:2; }
  #ground { position:absolute; bottom:0; width:100%; height:18%; background:#70cf55; border-top:5px solid #4da941; }
  #message {
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    align-items:center; background:#ffffffdd; z-index:10; text-align:center;
  }
  #message h2 { color:#5b3aa4; font-size:38px; margin:0 0 10px; }
  button {
    border:0; border-radius:18px; padding:14px 24px; font-size:20px; font-weight:bold;
    background:#ffcf45; color:#553900; cursor:pointer; box-shadow:0 4px #d49e18;
  }
  #controls { text-align:center; margin-top:10px; color:#4a287c; font-weight:bold; }
  .cloud { position:absolute; font-size:65px; opacity:.8; }
  #c1 {left:10%; top:12%} #c2 {right:12%; top:22%}
</style>
</head>
<body>
<div id="wrap">
  <h1>🌈 Rainbow Adventure ⭐</h1>
  <div id="game">
    <div id="hud"><span>⭐ Stars: <b id="score">0</b></span><span>🏆 Level 1</span></div>
    <div id="c1" class="cloud">☁️</div><div id="c2" class="cloud">☁️</div>
    <div id="ground"></div>
    <div id="player">🐰</div>
    <div id="message">
      <h2>Rainbow Adventure!</h2>
      <p>Use ⬆️ or tap the screen to jump.<br>Collect ⭐ and avoid 🪨!</p>
      <button id="start">Start Game</button>
    </div>
  </div>
  <div id="controls">Keyboard: ↑ / Space &nbsp; • &nbsp; Phone: tap to jump</div>
</div>
<script>
const game = document.getElementById('game');
const player = document.getElementById('player');
const scoreEl = document.getElementById('score');
const message = document.getElementById('message');
const startBtn = document.getElementById('start');

let running=false, score=0, jumping=false, vy=0, items=[], last=0, spawn=0;

function jump(){
  if (!running) return;
  if (!jumping) { jumping=true; vy=850; }
}
document.addEventListener('keydown', e => {
  if (e.code==='ArrowUp' || e.code==='Space') { e.preventDefault(); jump(); }
});
game.addEventListener('pointerdown', e => { if (running) jump(); });

function makeItem(type){
  const el=document.createElement('div');
  el.className=type;
  el.textContent=type==='star' ? '⭐' : '🪨';
  el.style.left=game.clientWidth+30+'px';
  el.style.bottom=(type==='star' ? (25+Math.random()*35) : 18)+'%';
  game.appendChild(el);
  items.push({el, x:game.clientWidth+30, type});
}
function reset(){
  items.forEach(i=>i.el.remove()); items=[];
  score=0; scoreEl.textContent=0; jumping=false; vy=0;
  player.style.bottom='19%';
  spawn=0; last=performance.now(); running=true; message.style.display='none';
  requestAnimationFrame(loop);
}
function end(){
  running=false;
  message.style.display='flex';
  message.querySelector('h2').textContent='Great Job! 🎉';
  message.querySelector('p').innerHTML=`You collected <b>${score}</b> stars!<br>Ready for another adventure?`;
  startBtn.textContent='Play Again';
}
function loop(t){
  if(!running) return;
  const dt=Math.min((t-last)/1000,.03); last=t;
  // gravity
  let bottom=parseFloat(getComputedStyle(player).bottom);
  if(jumping){
    vy-=1900*dt; bottom += vy*dt/10;
    if(bottom<=19){bottom=19;jumping=false;vy=0;}
    player.style.bottom=bottom+'%';
  }
  spawn-=dt;
  if(spawn<=0){
    makeItem(Math.random()<.62?'star':'obstacle');
    spawn=.65+Math.random()*.75;
  }
  const pr=player.getBoundingClientRect();
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; it.x-=300*dt; it.el.style.left=it.x+'px';
    const r=it.el.getBoundingClientRect();
    if(r.right<0){it.el.remove();items.splice(i,1);continue;}
    if(pr.left<r.right-8 && pr.right>r.left+8 && pr.top<r.bottom-5 && pr.bottom>r.top+5){
      if(it.type==='star'){
        score++; scoreEl.textContent=score; it.el.remove(); items.splice(i,1);
      } else { end(); return; }
    }
  }
  requestAnimationFrame(loop);
}
startBtn.onclick=reset;
</script>
</body>
</html>
